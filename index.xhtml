<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">


<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    
<title>
Stationery Sales System
</title>
    
<link rel="stylesheet" type="text/css" href="style.css" />
    
<script type="text/javascript" src="script.js">
</script>

</head>


<body>


<div class="container">
    
<h1>Stationery Sales System</h1>

    
<div class="card">
        
<h2>Add Purchase</h2>

        
<form action="purchase.php" method="post">
            
<input type="text" name="item_name" placeholder="Item Name" required="required" />
            
<input type="number" name="quantity" placeholder="Quantity" required="required" />
            
<input type="number" step="0.01" name="cost" placeholder="Cost" required="required" />
            
<button type="submit">
Save Purchase
</button>
        
</form>
    
</div>

    
<div class="card">
        
<h2>Add Sale</h2>

<form action="sale.php" method="post">
            
<input type="text" name="item_name" placeholder="Item Name" required="required" />
            
<input type="number" name="quantity" placeholder="Quantity" required="required" />
            
<input type="number" step="0.01" name="price" placeholder="Selling Price" required="required" />
            
<button type="submit">Save Sale</button>
        
</form>
    </div>

    <div class="card">
        
<h2>Add Expense</h2>

        
<form action="expense.php" method="post">
            
<input type="text" name="description" placeholder="Expense Description" required="required" />
            
<input type="number" step="0.01" name="amount" placeholder="Amount" required="required" />
            
<button type="submit">Save Expense</button>
        
</form>
    
</div>

</div>


</body>

</html>
